# Custom Cursor Extension Configuration
# Theme app extension for adding custom cursor functionality to Shopify storefronts
# Learn more: https://shopify.dev/docs/apps/online-store/theme-app-extensions

name = "custom-cursor-extension"
type = "theme"

# Unique identifier for this extension (auto-generated by Shopify CLI)
uid = "c09be26e-3ef0-ff2d-326e-175dd634b3e960d3f2f1"

# Extension capabilities
[capabilities]
# Network access for fetching cursor data from API endpoint
network_access = true

# Block visibility - controls where blocks can be added in theme editor
# app_embed type allows the app to be enabled/disabled by merchants
[capabilities.block_visibility]
# Enable app embed functionality for merchant control
app_embed = true

